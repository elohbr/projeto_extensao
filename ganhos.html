<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Ganhos - Pizzaria E</title>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background-image: url('imagem_fundo.png'); background-attachment: fixed; background-size: cover;
      color: #fdfaf7;
    }
    nav {
      position: fixed; top: 0; width: 100%; background-color: #012f17;
      display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box;
    }
    nav .logo img { height: 45px; }
    nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
    nav ul li a { color: #fff; text-decoration: none; font-weight: 500; }
    .container { max-width: 900px; margin: 120px auto 40px; padding: 20px; background-color: #00401A; }
    h2 { text-align: center; border-bottom: 2px solid #C62828; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background-color: #333; color: white; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
    th { background-color: #012f17; }
    .valor-ganho { color: greenyellow; font-weight: bold; }
    .form-atualizar { display: flex; gap: 5px; }
    .form-atualizar input { width: 80px; padding: 5px; background: #222; color: white; border: none; border-radius: 4px; }
    .form-atualizar button { background-color: green; color: white; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><img src="logo.png" alt="Pizzaria E"></div>
    <ul>
      <li><a href="index.html">🏠 Página Inicial</a></li>
      <li><a href="cadastro.html">Cadastro de Motoboy</a></li>
      <li><a href="ganhos.html">Ganhos</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Painel de Ganhos dos Motoboys</h2>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Celular</th>
          <th>Placa</th>
          <th>Modelo</th>
          <th>Total Ganho</th>
          <th>Adicionar Valor (R$)</th>
        </tr>
      </thead>
      <tbody id="tabela-motoboys">
        </tbody>
    </table>
  </div>

  <script>
    function carregarGanhos() {
      const lista = JSON.parse(localStorage.getItem('bd_pizzaria') || '[]');
      const tabela = document.getElementById('tabela-motoboys');
      tabela.innerHTML = '';

      if(lista.length === 0) {
        tabela.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum motoboy cadastrado.</td></tr>';
        return;
      }

      lista.forEach((m, index) => {
        tabela.innerHTML += `
          <tr>
            <td><strong>${m.nome}</strong></td>
            <td>${m.celular}</td>
            <td>${m.placa}</td>
            <td>${m.modelo}</td>
            <td class="valor-ganho">R$ ${parseFloat(m.ganhos || 0).toFixed(2)}</td>
            <td>
              <div class="form-atualizar">
                <input type="number" step="0.01" id="v_${index}" placeholder="0.00">
                <button onclick="lancarCorrida(${index})">+</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function lancarCorrida(index) {
      const valor = parseFloat(document.getElementById(`v_${index}`).value);
      if (!isNaN(valor) && valor > 0) {
        let lista = JSON.parse(localStorage.getItem('bd_pizzaria') || '[]');
        lista[index].ganhos = (parseFloat(lista[index].ganhos) || 0) + valor;
        localStorage.setItem('bd_pizzaria', JSON.stringify(lista));
        carregarGanhos();
      }
    }

    document.addEventListener('DOMContentLoaded', carregarGanhos);
  </script>
</body>
</html>
