<!DOCTYPE html>
<html lang="pt-BR">
<head>s
  <meta charset="UTF-8">
  <title>Ficha de Cadastro para Motoboy</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    emailjs.init("gibv8iDuqOfGfb5Sy");
  </script>

</head>
<style>
    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
      background-color: #00401A;
      border-radius: 0px;
      box-shadow: 0 0 10px #00401A;
      border-color: #C62828;
    }

    h1 {
      color: black;
      margin-bottom: 10px;
      background-image: url(letra_cad.png);
      text-indent: -9999px;
      background-position: center;
      width: 70%;
      height: 80px;
      display: flex;
      justify-content: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: white;
      font-size: 16px;
    }

    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 5px;
    }

    .radio-group label,
    .checkbox-group label {
      font-weight: normal;
    }
      textarea {
      resize: vertical;
    }

    input[type="submit"],
    input[type="reset"],
    input[type="button"] {
      width: 32%;
      margin-top: 20px;
      background-color: #C62828;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover,
    input[type="reset"]:hover,
    input[type="button"]:hover,

    input[type="image"]
    {
      display: block;
      margin: 30px auto 10px;
      max-width: 120px;
    }

    input[type="text"],
    input[type="email"]{
      width: 97%;
    }

    .campos {
      display: flex;
      flex-direction: column;


    }

</style>

    <body style="background-image: url('imagem_fundo.png'); color: #ccc; background-attachment: fixed;background-size: cover;">
<div class="container">

    <a href="index.html" style="color: white; font-weight: bold; display: inline-block; margin-bottom: 30px; text-align: center;">
      🏠 Voltar para a Página Inicial
    </a>

    <form id="formMotoboy" action="/cadastrar" method="POST" style="max-width: 390px; width: 100%; margin: 0 auto; background-color: #00401A; padding: 15px;">

<h1 style="url('letra_cad.png'); justify-content: center; align-items: center;">.</h1>
  <div class="image">
  <label for= "txt_name"> Nome Completo: </label>
  <input type="text" name="txt_name"  maxlength="30" required>

  <label for= "cpf"> CPF: </label>
  <input type="text" id="cpf" name="txt_cpf" maxlength="14" placeholder="xxx.xxx.xxx-xx" required>

  <label for= "txt_email"> Email: </label>
  <input type="email" name="txt_email" required>

  <label for= "cel"> Celular: </label>
  <input type="text" id="cel" name="txt_cel" maxlength="15" placeholder="(xx) xxxxx-xxxx" required>

  <label for= "tel"> Contato de Emergência: </label>
  <input type="text" id="tel" name="txt_tel" maxlength="15" placeholder="(xx) xxxxx-xxxx" required>
    </div>

    <div style="display: flex;justify-content: space-between;">
    <input type="submit"value="Salvar" style="background-color: green">
    <input type="reset" value="Cancelar">

</form>

    <script>
    const telefone = document.getElementById("cel");

    telefone.addEventListener("input", function () {
        let valor = telefone.value;

        valor = valor.replace(/\D/g, "");
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2");

        telefone.value = valor;
    });
    </script>

    <script>
    const telefone_emer = document.getElementById("tel");

    telefone_emer.addEventListener("input", function () {
        let valor = telefone_emer.value;

        valor = valor.replace(/\D/g, "");
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2");

        telefone_emer.value = valor;
    });
    </script>

    <script>
    const cpf = document.getElementById("cpf");

    cpf.addEventListener("input", function () {
      let valor = cpf.value;

      valor = valor.replace(/\D/g, "");

      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

      cpf.value = valor;
    });
    </script>

    <script>
    document.getElementById("formMotoboy").addEventListener("submit", function(event) {
        event.preventDefault(); 

        
        let nome = document.querySelector('input[name="txt_name"]').value;
        let cpf = document.getElementById("cpf").value;
        let email = document.querySelector('input[name="txt_email"]').value;
        let celular = document.getElementById("cel").value;

        
        emailjs.send("service_qj8rixj", "template_oxr9upu", {
            to_email: email,
            nome: nome
        })
        .then(function() {
            
            let lista = JSON.parse(localStorage.getItem('bd_pizzaria') || '[]');
            
            lista.push({
                nome: nome,
                cpf: cpf,
                email: email,
                celular: celular,
                modelo: "Não Informado", 
                placa: "Não Informado",
                ganhos: 0.0
            });

            
            localStorage.setItem('bd_pizzaria', JSON.stringify(lista));

            alert("Cadastro realizado e e-mail de confirmação enviado com sucesso!");
            window.location.href = "index.html"; 
        })
        .catch(function(error) {
            console.log("ERRO AO ENVIAR E-MAIL:", error);
            alert("Erro ao enviar e-mail de confirmação. O cadastro não foi finalizado.");
        });
    });
    </script>

</div>
</body>
</html>
