<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ficha de Cadastro para Motoboy</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    emailjs.init("gibv8iDuqOfGfb5Sy");
  </script>

</head>
<style>
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #1c1c1c;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }

    h1 {
      text-align: center;
      color: #C62828;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: white;
      font-size: 16px;
    }

    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 5px;
    }

    .radio-group label,
    .checkbox-group label {
      font-weight: normal;
    }
      textarea {
      resize: vertical;
    }

    input[type="submit"],
    input[type="reset"],
    input[type="button"] {
      width: 32%;
      margin-top: 20px;
      background-color: #C62828;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover,
    input[type="reset"]:hover,
    input[type="button"]:hover {
      /* background-color: #C62828; */
    }

    input[type="image"]
    {
      display: block;
      margin: 30px auto 10px;
      max-width: 120px;
    }

    input[type="text"],
    input[type="email"]{
      width: 97%;
    }

    .campos {
      display: flex;
      flex-direction: column;


    }

</style>

    <body style="background-image: url('logo.png'); color: #ccc;">    
<div class="container">

    <a href="page_inicial.html" style="color: #C62828; font-weight: bold; display: inline-block; margin-bottom: 20px;">
      🏠 Voltar para a Página Inicial
    </a>

    <form id="formMotoboy">

    <h1>Cadastre o novo Motoboy</h1>
      <div class="campos">
      <label for= "txt_name"> Nome Completo: </label>
      <input type="text" name="txt_name"  maxlength="30" required>

      <label for= "cpf"> CPF: </label>
      <input type="text" id="cpf"  maxlength="14" placeholder="xxx.xxx.xxx-xx" required>

      <label for= "txt_email"> Email: </label>
      <input type="email" name="txt_email" required>

      <label for= "cel"> Celular: </label>
      <input type="text" id="cel" maxlength="15" placeholder="(xx) xxxxx-xxxx" required>

      <label for= "tel"> Contato de Emergência: </label>
      <input type="text" id="tel" maxlength="15" placeholder="(xx) xxxxx-xxxx" required>
    
      <label for= "modelo"> Modelo: </label>
      <input type="text" name="modelo" required>
       
      <label for= "placa"> Placa: </label>
      <input type="text" name="placa" maxlength="8" required> 
      <br>
    </div>

    <div style="display: flex; justify-content: space-between;">
    <input type="submit"value="Salvar" style="background-color: green">
    <input type="reset" value="Cancelar">

</form>

    <script>
    const telefone = document.getElementById("cel");

    telefone.addEventListener("input", function () {
        let valor = telefone.value;

        valor = valor.replace(/\D/g, "");
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2");

        telefone.value = valor;
    });
    </script>

    <script>
    const telefone_emer = document.getElementById("tel");

    telefone_emer.addEventListener("input", function () {
        let valor = telefone_emer.value;

        valor = valor.replace(/\D/g, "");
        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
        valor = valor.replace(/(\d{5})(\d)/, "$1-$2");

        telefone_emer.value = valor;
    });
    </script>

    <script>
    const cpf = document.getElementById("cpf");

    cpf.addEventListener("input", function () {
      let valor = cpf.value;

      valor = valor.replace(/\D/g, "");

      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

      cpf.value = valor;
    });
    </script>

    <script>
document.getElementById("formMotoboy").addEventListener("submit", function(event) {
    event.preventDefault();

    let email = document.querySelector('input[name="txt_email"]').value;
    let nome = document.querySelector('input[name="txt_name"]').value;

    emailjs.send("service_qj8rixj", "template_oxr9upu", {
        to_email: email,
        nome: nome
    })
    .then(function() {
        alert("Cadastro enviado com sucesso!");
    })
.catch(function(error) {
    console.log("ERRO:", error);
    alert("Erro: " + JSON.stringify(error));
});
});
</script>

</div>
</body>
</html>
